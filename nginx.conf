server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/woff2 application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|map|png|jpe?g|gif|ico|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}